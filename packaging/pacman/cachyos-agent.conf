# Personal repository for reviewed CachyOS Agent releases.
# Packages and the database are signed. Import and locally sign the
# maintainer key before enabling this repository:
#   sudo pacman-key --add cachyos-agent-signing-key.asc
#   sudo pacman-key --lsign-key <fingerprint>
# The key is published on each GitHub release and at the repo branch root.
[cachyos-agent]
SigLevel = Required DatabaseRequired
Server = https://raw.githubusercontent.com/keiranhaax/CachyOS-Agent/repo/$arch
